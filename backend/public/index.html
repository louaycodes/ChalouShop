<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backoffice</title>
  <style>
    body { font-family: system-ui, Arial; margin: 24px; }
    input, textarea, select, button { padding: 8px; margin: 4px 0; width: 100%; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    .tabs button { width: auto; margin-right: 8px; }
    .hidden { display: none; }
    .small { font-size: 12px; color: #666; }
    .danger { background: #ffecec; }
    #msg { margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    .muted { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Backoffice</h1>

  <div class="row">
    <div>
      <label>Admin Key</label>
      <input id="key" placeholder="Colle ta clé ADMIN_KEY" />
      <div class="small">La clé doit être la même que dans docker-compose (ADMIN_KEY)</div>
      <div class="muted">Tip: si tu mets une clé vide → 401</div>
    </div>
    <div class="tabs">
      <label>Navigation</label><br/>
      <button id="tabProducts" type="button">Produits</button>
      <button id="tabOrders" type="button">Commandes</button>
    </div>
  </div>

  <div id="msg">Status: prêt ✅</div>

  <hr/>

  <section id="productsTab">
    <h2>Produits</h2>
    <h3>Ajouter / Modifier</h3>

    <input id="pid" placeholder="Product ID (vide = ajout)" />
    <input id="name" placeholder="Nom" />
    <textarea id="desc" placeholder="Description"></textarea>

    <div class="row">
      <input id="price" type="number" step="0.01" placeholder="Prix (ex: 49.90)" />
      <select id="is_active">
        <option value="true">Actif</option>
        <option value="false">Inactif</option>
      </select>
    </div>

    <input id="image_url" placeholder="Image URL (optionnel)" />

    <div class="row">
      <button id="btnSave" type="button">💾 Enregistrer</button>
      <button id="btnDelete" type="button" class="danger">🗑️ Supprimer</button>
    </div>

    <h3>Liste</h3>
    <button id="btnRefreshProducts" type="button">🔄 Rafraîchir</button>
    <table id="productsTable"></table>
  </section>

  <section id="ordersTab" class="hidden">
    <h2>Commandes</h2>
    <button id="btnRefreshOrders" type="button">🔄 Rafraîchir</button>
    <table id="ordersTable"></table>
  </section>

<script>
  const msg = (t) => (document.getElementById("msg").textContent = "Status: " + t);

  function adminKey() { return document.getElementById("key").value.trim(); }
  function headers() { return { "Content-Type":"application/json", "x-admin-key": adminKey() }; }

  function showTab(tab) {
    document.getElementById("productsTab").classList.toggle("hidden", tab !== "products");
    document.getElementById("ordersTab").classList.toggle("hidden", tab !== "orders");
  }

  // Robust response reader: works with JSON, empty body, or text/html errors
  async function readResponse(res) {
    const raw = await res.text();
    if (!raw) return { raw: "", json: null };
    try { return { raw, json: JSON.parse(raw) }; }
    catch { return { raw, json: null }; }
  }

  function showError(prefix, resStatus, payload) {
    const printable = payload?.json ?? (payload?.raw ? { raw: payload.raw.slice(0, 500) } : {});
    console.error(prefix, "status=", resStatus, "payload=", printable);
    alert(`${prefix} (HTTP ${resStatus}) : ` + JSON.stringify(printable));
  }

  async function loadProducts() {
    if (!adminKey()) return alert("Mets Admin Key d'abord.");
    msg("chargement produits...");
    const res = await fetch("/admin/api/products", { headers: headers() });
    const payload = await readResponse(res);

    if (!res.ok) { msg("Erreur produits"); return showError("Erreur produits", res.status, payload); }

    const data = payload.json || [];
    const t = document.getElementById("productsTable");
    t.innerHTML = `
      <tr><th>ID</th><th>Nom</th><th>Prix</th><th>Actif</th><th>Image</th></tr>
    ` + data.map(p => `
      <tr data-id="${p.id}">
        <td>${p.id}</td>
        <td>${escapeHtml(p.name)}</td>
        <td>${p.price}</td>
        <td>${p.is_active}</td>
        <td>${p.image_url ? "✅" : ""}</td>
      </tr>
    `).join("");

    t.querySelectorAll("tr[data-id]").forEach(tr => {
      tr.addEventListener("click", () => fillForm(tr.getAttribute("data-id")));
    });

    window._products = data;
    msg("produits chargés ✅");
  }

  function fillForm(id) {
    const p = (window._products || []).find(x => x.id === id);
    if (!p) return;
    document.getElementById("pid").value = p.id;
    document.getElementById("name").value = p.name ?? "";
    document.getElementById("desc").value = p.description ?? "";
    document.getElementById("price").value = p.price ?? "";
    document.getElementById("image_url").value = p.image_url ?? "";
    document.getElementById("is_active").value = String(p.is_active);
    msg("édition produit: " + p.name);
  }

  async function saveProduct() {
    const id = document.getElementById("pid").value.trim();
    const name = document.getElementById("name").value.trim();
    const priceStr = document.getElementById("price").value;

    if (!adminKey()) return alert("Mets Admin Key d'abord.");
    if (!name) return alert("Nom obligatoire.");
    if (priceStr === "" || isNaN(Number(priceStr))) return alert("Prix invalide.");

    const payload = {
      name,
      description: document.getElementById("desc").value.trim() || null,
      price: Number(priceStr),
      image_url: document.getElementById("image_url").value.trim() || null,
      is_active: document.getElementById("is_active").value === "true",
    };

    const url = id ? `/admin/api/products/${id}` : "/admin/api/products";
    const method = id ? "PUT" : "POST";

    msg(id ? "modification..." : "ajout...");
    const res = await fetch(url, { method, headers: headers(), body: JSON.stringify(payload) });
    const out = await readResponse(res);

    if (!res.ok) { msg("Erreur save"); return showError("Erreur sauvegarde", res.status, out); }

    alert(id ? "Produit modifié ✅" : "Produit ajouté ✅");
    document.getElementById("pid").value = ""; // reset id (évite modif involontaire)
    await loadProducts();
  }

  async function deleteProduct() {
    const id = document.getElementById("pid").value.trim();
    if (!adminKey()) return alert("Mets Admin Key d'abord.");
    if (!id) return alert("Mets Product ID d'abord.");
    if (!confirm("Supprimer ce produit ?")) return;

    msg("suppression...");
    const res = await fetch(`/admin/api/products/${id}`, { method: "DELETE", headers: headers() });
    const out = await readResponse(res);

    if (!res.ok) { msg("Erreur delete"); return showError("Erreur suppression", res.status, out); }

    alert("Supprimé ✅");
    document.getElementById("pid").value = "";
    await loadProducts();
  }

  async function loadOrders() {
    if (!adminKey()) return alert("Mets Admin Key d'abord.");
    msg("chargement commandes...");
    const res = await fetch("/admin/api/orders", { headers: headers() });
    const payload = await readResponse(res);

    if (!res.ok) { msg("Erreur commandes"); return showError("Erreur commandes", res.status, payload); }

    const data = payload.json || [];
    const t = document.getElementById("ordersTable");
    t.innerHTML = `
      <tr><th>ID</th><th>Client</th><th>Téléphone</th><th>Status</th><th>Total</th><th>Date</th></tr>
    ` + data.map(o => `
      <tr>
        <td>${o.id}</td>
        <td>${escapeHtml(o.customer_name)}</td>
        <td>${escapeHtml(o.phone)}</td>
        <td>${o.status}</td>
        <td>${o.total}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("");

    msg("commandes chargées ✅");
  }

  function escapeHtml(s) {
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }

  window.addEventListener("DOMContentLoaded", () => {
    msg("JS chargé ✅ (events bind)");
    document.getElementById("tabProducts").addEventListener("click", () => showTab("products"));
    document.getElementById("tabOrders").addEventListener("click", () => showTab("orders"));
    document.getElementById("btnRefreshProducts").addEventListener("click", loadProducts);
    document.getElementById("btnSave").addEventListener("click", saveProduct);
    document.getElementById("btnDelete").addEventListener("click", deleteProduct);
    document.getElementById("btnRefreshOrders").addEventListener("click", loadOrders);
  });
</script>
</body>
</html>
